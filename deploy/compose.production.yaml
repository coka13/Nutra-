# Production stack for a single VPS (e.g. Hostinger KVM): app + Caddy (automatic HTTPS for
# both domains) + a scheduler for jobs and backups. Secrets live in deploy/.env.production on
# the server only (see deploy/env.production.example); never commit that file.
#
#   docker compose -f deploy/compose.production.yaml --env-file deploy/.env.production up -d
name: nutra
services:
  app:
    image: nutra-app:${IMAGE_TAG:-latest}
    build:
      context: ..
      args:
        GIT_SHA: ${IMAGE_TAG:-}
    env_file: .env.production
    environment:
      DATABASE_URL: file:/data/nutri.db
      BACKUP_DIR: /data/backups
      NODE_ENV: production
      DEMO_ENABLED: "false"
      ENFORCE_HTTPS: "true"
    volumes:
      - nutri_data:/data
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2.8.4-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_HOST: ${ADMIN_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Calls the protected job endpoint: announcements/cleanup every 5 minutes, backup nightly.
  scheduler:
    image: curlimages/curl:8.10.1
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/jobs/run > /dev/null || echo "jobs failed"
          if [ "$$(date -u +%H%M)" -ge 0300 ] && [ "$$(date -u +%H%M)" -lt 0305 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/jobs/run?job=backup" > /dev/null || echo "backup failed"
          fi
          sleep 300
        done
    restart: unless-stopped

volumes:
  nutri_data:
  caddy_data:
  caddy_config:
