name: Verify Fitura+
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Integration and browser checks
        run: |
          npm run dev > /tmp/nutri-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/login > /dev/null && break; sleep 1; done
          npm run test:api
          npm run test:admin
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
